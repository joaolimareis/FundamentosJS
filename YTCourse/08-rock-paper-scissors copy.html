
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>
<body>
  <p>Rock Paper Scissors</p>
  <button onclick ="
    playeGame('rock');
  ">rock</button>
   <button onclick ="
    playeGame('paper');
  ">paper</button>
   <button onclick ="
    playeGame('scissors');
  ">scissors</button>

  <button onclick="
      score.wins = 0
      score.losses = 0
      score.ties = 0

      localStorage.removeItem('score')
  "> 
     Reset Score
  </button>


  <script>

    let score = JSON.parse(localStorage.getItem('score')) ||
    {
          wins : 0,
          losses: 0,
          ties: 0
        }
        
      // if(!score) {
      //   score = {
      //     wins : 0,
      //     losses: 0,
      //     ties: 0
      //   }

      // }

      function playeGame(playerMove){
            const computerMove = pickComputerMove()
           console.log(computerMove)
            let result = '';

                if(playerMove === 'rock'){if (computerMove === 'rock'){
                  result = 'Tie.'
              } else if (computerMove === 'paper'){
                  result = 'You Lose.'
              } else if(computerMove === 'scissors'){
                  result = 'You Win.'
              
              }}
                else if (playerMove === 'paper') {
                if (computerMove === 'rock'){
                  result = 'You Win.'

                }else if(computerMove === 'paper'){
                  result = ' Tie.'

                } else if (computerMove === 'scissors'){
                  result = 'You Lose.'
                }
              }else if (playerMove === 'scissors') {
                if (computerMove === 'rock'){
                  result = 'You lose.'

                }else if(computerMove === 'paper'){
                  result = 'You Win.'

                } else if (computerMove === 'scissors'){
                  result = 'Tie.'
                }
              }
                  if (result === 'You Win.' ) {
                    score.wins = score.wins + 1 // score.wins += 1;
                  } else if (result === 'You Lose.') {
                    score.losses += 1
                  } else if (result === 'Tie.') {
                    score.ties += 1

                  }

                  localStorage.setItem('score', JSON.stringify(score));

                  alert(`YOu picked ${playerMove} Computer picked ${computerMove}. ${result} wins: ${score.wins}. losses: ${score.losses}. ties: ${score.ties}`)

            }    
            
      function pickComputerMove(){
         const randomNumber = Math.random();
         console.log(randomNumber)
         let computerMove = ''
            if (randomNumber >= 0 && randomNumber < 1/3){ 
              computerMove = 'rock';
            } else if (randomNumber >= 1/3 && randomNumber < 2/3){
              computerMove = 'paper';
            } else{
              computerMove = 'scissors';
            } 
            return computerMove
      }
</script>
</body>
</html>
